summary-en: Run local ComfyUI workflows headlessly over the HTTP API — convert workflow JSON to an API prompt, refresh FallingTS mdtable state from its md, submit, poll, and verify the artifact.
summary-cn: 通过 HTTP API 无头运行本地 ComfyUI 工作流：工作流 JSON 转 API prompt、按 md 刷新 FallingTS 数据表状态、提交轮询、并校验产出。
desc-en: Designed for running and re-running local ComfyUI workflows without touching the browser. Covers converting a saved workflow JSON into the API prompt format ComfyUI expects (including Reroute resolution, frontend-only node skipping, and correct widget-to-input mapping), refreshing a FallingTS Markdown data table from its md file the same way the frontend refresh button does, submitting to /prompt, polling /history to completion, and verifying the produced artifact with ffprobe plus frame extraction. Use it when a workflow must be executed headlessly, when a prompt edited in an md data table must actually take effect, or when a render needs objective inspection. Not for writing prompt text or developing nodes.
desc-cn: 面向"不碰浏览器也能跑本地 ComfyUI 工作流"的场景。涵盖：把保存的工作流 JSON 转成 ComfyUI 期望的 API prompt 格式（含 Reroute 解析、前端专用节点跳过、widget 与输入的精确映射）、以与前端刷新按钮完全一致的方式按 md 文件刷新 FallingTS 数据表状态、提交 /prompt、轮询 /history 至完成、并用 ffprobe 加抽帧校验产出。另附 H3 场景视频的多轮实测结论（各方案性能对比、单图锚点为何反超多图参考、提示词四条硬经验、旋转速率上限、OrbitSheets 参数配方及其局限、改参数与抽帧的陷阱）。适用于需要无头执行工作流、md 数据表里改过的提示词必须真正生效、或需要对成片做客观检查的场合。不适用于撰写提示词文本或开发节点。
